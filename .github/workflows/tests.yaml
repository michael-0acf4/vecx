# .github/workflows/make.yml
name: Build and Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential make gcc

      - name: Set up dependencies (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          choco install make --yes
          choco install mingw --yes
          refreshenv

      - name: Build
        run: make build

      - name: Test
        run: make test
